var MODULES = [];
var seen = {};
DATA.forEach(function(d) { if (!seen[d.mod]) { seen[d.mod] = true; MODULES.push(d.mod); } });

function renderNav() {
  var nav = document.getElementById('navRow');
  while (nav.firstChild) nav.removeChild(nav.firstChild);

  var allPill = document.createElement('a');
  allPill.className = 'nav-pill active';
  allPill.setAttribute('data-mod', 'all');
  allPill.onclick = function() { filterMod('all'); };
  allPill.textContent = 'ทั้งหมด (' + DATA.length + ')';
  nav.appendChild(allPill);

  MODULES.forEach(function(mod) {
    var items = DATA.filter(function(d) { return d.mod === mod; });
    var pill = document.createElement('a');
    pill.className = 'nav-pill';
    pill.setAttribute('data-mod', mod);
    pill.onclick = function() { filterMod(mod); };
    pill.textContent = mod.replace('Production - ', '') + ' (' + items.length + ')';
    nav.appendChild(pill);
  });
}

function filterMod(mod) {
  document.querySelectorAll('.nav-pill').forEach(function(p) { p.classList.remove('active'); });
  var active = document.querySelector('.nav-pill[data-mod="' + mod + '"]');
  if (active) active.classList.add('active');

  var filtered = mod === 'all' ? DATA : DATA.filter(function(d) { return d.mod === mod; });
  renderTable(filtered, mod);
  document.getElementById('tableArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderTable(items, mod) {
  var area = document.getElementById('tableArea');
  while (area.firstChild) area.removeChild(area.firstChild);

  var first = items[0] || DATA[0];
  var title = mod === 'all' ? 'ทั้งหมด' : mod;

  // Wrapper
  var wrap = document.createElement('div');
  wrap.className = 'tbl-wrap';

  // Title
  var titleDiv = document.createElement('div');
  titleDiv.className = 'tbl-title';
  var iconDiv = document.createElement('div');
  iconDiv.className = 'mod-icon';
  iconDiv.style.background = mod === 'all' ? '#f1f5f9' : first.iconBg;
  iconDiv.style.color = mod === 'all' ? '#475569' : first.iconC;
  iconDiv.textContent = mod === 'all' ? '\uD83D\uDCCB' : '';
  titleDiv.appendChild(iconDiv);
  var titleText = document.createTextNode(' ' + title + ' ');
  titleDiv.appendChild(titleText);
  var countSpan = document.createElement('div');
  countSpan.className = 'count';
  countSpan.textContent = items.length + ' รายการ';
  titleDiv.appendChild(countSpan);
  wrap.appendChild(titleDiv);

  // Scroll container
  var scrollDiv = document.createElement('div');
  scrollDiv.style.overflowX = 'auto';

  // Table
  var table = document.createElement('table');
  table.className = 'changelog';

  // Thead
  var thead = document.createElement('thead');
  var headRow = document.createElement('tr');
  var headers = ['ลำดับ', 'Module', 'เมนูย่อย', 'ประเภท', 'การแก้ไข / การพัฒนา', 'ว/ด/ป', 'Prompt ที่แก้ไข'];
  var widths = ['40px', '130px', '110px', '80px', '250px', '90px', '280px'];
  headers.forEach(function(h, i) {
    var th = document.createElement('th');
    th.textContent = h;
    if (widths[i]) th.style.minWidth = widths[i];
    if (i === 0) th.style.width = '40px';
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  // Tbody
  var tbody = document.createElement('tbody');
  items.forEach(function(d, i) {
    var tr = document.createElement('tr');

    var tdNo = document.createElement('td');
    tdNo.className = 'no';
    tdNo.textContent = String(i + 1);
    tr.appendChild(tdNo);

    var tdMod = document.createElement('td');
    tdMod.className = 'submenu-col';
    tdMod.textContent = d.mod.replace('Production - ', '');
    tr.appendChild(tdMod);

    var tdSub = document.createElement('td');
    tdSub.className = 'submenu-col';
    tdSub.textContent = d.sub;
    tr.appendChild(tdSub);

    var tdType = document.createElement('td');
    var badge = document.createElement('span');
    badge.className = 'type-badge';
    var typeMap = { feat: ['t-feat', 'Feature'], fix: ['t-fix', 'Bug Fix'], refac: ['t-refac', 'Refactor'], docs: ['t-docs', 'Docs'], test: ['t-test', 'Test'] };
    var tm = typeMap[d.type] || ['t-docs', d.type];
    badge.classList.add(tm[0]);
    badge.textContent = tm[1];
    tdType.appendChild(badge);
    tr.appendChild(tdType);

    var tdDesc = document.createElement('td');
    tdDesc.className = 'desc-col';
    tdDesc.textContent = d.desc;
    tr.appendChild(tdDesc);

    var tdDate = document.createElement('td');
    tdDate.className = 'date-col';
    tdDate.textContent = d.date;
    tr.appendChild(tdDate);

    var tdPrompt = document.createElement('td');
    tdPrompt.className = 'prompt-col';
    tdPrompt.textContent = d.prompt;
    tr.appendChild(tdPrompt);

    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  scrollDiv.appendChild(table);
  wrap.appendChild(scrollDiv);
  area.appendChild(wrap);
}

function exportExcel() {
  var rows = DATA.map(function(d, i) {
    return {
      'ลำดับ': i + 1,
      'Module': d.mod,
      'เมนูย่อย': d.sub,
      'ประเภท': d.type.toUpperCase(),
      'การแก้ไข / การพัฒนา': d.desc,
      'วันที่แก้ไข': d.date,
      'Prompt ที่แก้ไข': d.prompt
    };
  });
  var wb = XLSX.utils.book_new();
  var ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{ wch: 6 }, { wch: 28 }, { wch: 18 }, { wch: 10 }, { wch: 65 }, { wch: 12 }, { wch: 70 }];
  XLSX.utils.book_append_sheet(wb, ws, 'Changelog');

  var summary = MODULES.map(function(mod) {
    var items = DATA.filter(function(d) { return d.mod === mod; });
    return { Module: mod, Features: items.filter(function(d){return d.type==='feat';}).length, Fixes: items.filter(function(d){return d.type==='fix';}).length, Others: items.filter(function(d){return d.type!=='feat'&&d.type!=='fix';}).length, Total: items.length };
  });
  summary.push({ Module: 'TOTAL', Features: summary.reduce(function(s,r){return s+r.Features;},0), Fixes: summary.reduce(function(s,r){return s+r.Fixes;},0), Others: summary.reduce(function(s,r){return s+r.Others;},0), Total: summary.reduce(function(s,r){return s+r.Total;},0) });
  var ws2 = XLSX.utils.json_to_sheet(summary);
  ws2['!cols'] = [{ wch: 28 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 10 }];
  XLSX.utils.book_append_sheet(wb, ws2, 'Summary');
  XLSX.writeFile(wb, 'Herbal-ERP-Changelog-2569-03-25.xlsx');
}

window.addEventListener('scroll', function() {
  document.getElementById('backToTop').classList.toggle('visible', window.scrollY > 300);
}, { passive: true });

renderNav();
filterMod('all');
</script>
