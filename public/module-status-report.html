// ── SAFE DOM HELPERS ──────────────────────────────────
function el(tag, attrs, children) {
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k) {
    if (k === 'className') e.className = attrs[k];
    else if (k === 'textContent') e.textContent = attrs[k];
    else if (k === 'onclick') e.onclick = attrs[k];
    else e.setAttribute(k, attrs[k]);
  });
  if (children) {
    if (typeof children === 'string') e.textContent = children;
    else if (Array.isArray(children)) children.forEach(function(c) { if (c) e.appendChild(c); });
    else e.appendChild(children);
  }
  return e;
}

function textEl(tag, text, cls) {
  var e = document.createElement(tag);
  e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

// ── RENDER ─────────────────────────────────────────────
function render() {
  var now = new Date();
  var thaiYear = now.getFullYear() + 543;
  var months = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  document.getElementById('reportDate').textContent =
    'รายงาน ณ วันที่ ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + thaiYear;

  var avg = Math.round(MODULES.reduce(function(s,m){ return s+m.pct; }, 0) / MODULES.length);
  document.getElementById('overallPct').textContent = avg;
  setTimeout(function() { document.getElementById('overallBar').style.width = avg + '%'; }, 100);

  var ready = 0, partial = 0, dev = 0;
  MODULES.forEach(function(m) { if(m.pct >= 80) ready++; else if(m.pct >= 65) partial++; else dev++; });

  // Stats row
  var statsRow = document.getElementById('statsRow');
  var statsData = [
    { cls: 'blue', num: '17', lbl: 'Modules' },
    { cls: 'blue', num: '236', lbl: 'Pages' },
    { cls: 'blue', num: '497', lbl: 'API Routes' },
    { cls: 'blue', num: '170+', lbl: 'Tables' },
    { cls: 'green', num: String(ready), lbl: 'พร้อมใช้งาน (\u226580%)' },
    { cls: 'yellow', num: String(partial), lbl: 'ใช้ได้บางส่วน (65-79%)' },
    { cls: 'red', num: String(dev), lbl: 'ต้องพัฒนาเพิ่ม (<65%)' }
  ];
  statsData.forEach(function(s) {
    var chip = el('div', { className: 'stat-chip ' + s.cls }, [
      textEl('span', s.num, 'num'),
      textEl('span', s.lbl, 'lbl')
    ]);
    statsRow.appendChild(chip);
  });
  var exportBtn = el('button', { className: 'btn-export', onclick: exportExcel });
  exportBtn.textContent = '\u{1f4e5} Export Excel';
  statsRow.appendChild(exportBtn);

  // Cross-cutting cards
  var crossGrid = document.getElementById('crossGrid');
  CROSS_CUTTING.forEach(function(c) {
    var card = el('div', { className: 'cross-card' }, [
      textEl('h3', c.title),
      (function() {
        var row = el('div', { style: 'display:flex;justify-content:space-between;align-items:center;' }, [
          textEl('span', c.detail, 'cross-info'),
          (function() {
            var pctSpan = textEl('span', c.pct + '%');
            pctSpan.style.fontWeight = '700';
            pctSpan.style.fontSize = '18px';
            pctSpan.style.color = c.color;
            return pctSpan;
          })()
        ]);
        return row;
      })(),
      (function() {
        var barWrap = el('div', { className: 'cross-bar' });
        var fill = el('div', { className: 'cross-fill' });
        fill.style.width = c.pct + '%';
        fill.style.background = c.color;
        barWrap.appendChild(fill);
        return barWrap;
      })(),
      textEl('div', c.status, 'cross-info')
    ]);
    crossGrid.appendChild(card);
  });

  // Module cards
  var sorted = MODULES.slice().sort(function(a,b) { return b.pct - a.pct; });
  var moduleGrid = document.getElementById('moduleGrid');

  sorted.forEach(function(m) {
    var cls = m.pct >= 80 ? 'p-high' : m.pct >= 65 ? 'p-mid' : 'p-low';

    var ul = el('ul');
    m.done.forEach(function(d) {
      ul.appendChild(el('li', { className: 'done', textContent: d }));
    });
    m.pending.forEach(function(p) {
      ul.appendChild(el('li', { className: p.level, textContent: p.text }));
    });

    var statsDiv = el('div', { className: 'mod-stats' });
    [
      { v: m.pages, l: 'Pages' },
      { v: m.apis, l: 'APIs' },
      { v: m.tests, l: 'Tests' },
      { v: m.services, l: 'Services' },
      { v: m.tables, l: 'Tables' },
      { v: m.validations, l: 'Validations' }
    ].forEach(function(s) {
      var stat = el('span', { className: 'mod-stat' }, [
        textEl('b', String(s.v)),
        document.createTextNode(' ' + s.l)
      ]);
      statsDiv.appendChild(stat);
    });

    var card = el('div', { className: 'mod-card' }, [
      el('div', { className: 'mod-card-head' }, [
        el('div', {}, [
          textEl('div', m.name, 'mod-name'),
          textEl('div', m.nameEn, 'mod-name-en')
        ]),
        textEl('div', m.pct + '%', 'mod-pct ' + cls)
      ]),
      (function() {
        var bar = el('div', { className: 'mod-bar' });
        var fill = el('div', { className: 'mod-bar-fill ' + cls });
        fill.style.width = m.pct + '%';
        bar.appendChild(fill);
        return bar;
      })(),
      statsDiv,
      el('div', { className: 'mod-detail' }, [ul])
    ]);
    moduleGrid.appendChild(card);
  });

  // Priority table
  var tbody = document.getElementById('priorityBody');
  PRIORITIES.forEach(function(p, i) {
    var bcls = p.level === 'critical' ? 'b-critical' : p.level === 'medium' ? 'b-medium' : 'b-low';
    var tr = el('tr', {}, [
      (function() {
        var td = el('td', { textContent: String(i+1) });
        td.style.textAlign = 'center';
        td.style.color = '#94a3b8';
        td.style.fontWeight = '600';
        return td;
      })(),
      el('td', {}, [ textEl('span', p.label, 'badge ' + bcls) ]),
      (function() {
        var td = el('td', { textContent: p.item });
        td.style.fontWeight = '600';
        td.style.color = '#0f172a';
        return td;
      })(),
      (function() {
        var td = el('td', { textContent: p.module });
        td.style.color = '#475569';
        return td;
      })(),
      (function() {
        var td = el('td', { textContent: p.detail });
        td.style.color = '#475569';
        td.style.fontSize = '13px';
        return td;
      })()
    ]);
    tbody.appendChild(tr);
  });
}

// ── EXPORT EXCEL ────────────────────────────────────────
function exportExcel() {
  var wb = XLSX.utils.book_new();

  var summaryData = MODULES.map(function(m, i) {
    return {
      '#': i+1,
      'Module (TH)': m.name,
      'Module (EN)': m.nameEn,
      'Completion %': m.pct,
      'Pages': m.pages,
      'API Routes': m.apis,
      'Tests': m.tests,
      'Services': m.services,
      'Tables': m.tables,
      'Validations': m.validations,
      'Status': m.pct >= 80 ? 'Ready' : m.pct >= 65 ? 'Partial' : 'Needs Development'
    };
  });
  var ws1 = XLSX.utils.json_to_sheet(summaryData);
  ws1['!cols'] = [{wch:4},{wch:22},{wch:20},{wch:14},{wch:8},{wch:12},{wch:8},{wch:10},{wch:8},{wch:12},{wch:18}];
  XLSX.utils.book_append_sheet(wb, ws1, 'Module Summary');

  var pendingData = PRIORITIES.map(function(p, i) {
    return { '#': i+1, 'Priority': p.label, 'Item': p.item, 'Module': p.module, 'Detail': p.detail };
  });
  var ws2 = XLSX.utils.json_to_sheet(pendingData);
  ws2['!cols'] = [{wch:4},{wch:14},{wch:35},{wch:15},{wch:60}];
  XLSX.utils.book_append_sheet(wb, ws2, 'Pending Items');

  var detailRows = [];
  MODULES.forEach(function(m) {
    m.done.forEach(function(d) { detailRows.push({ Module: m.name, Status: 'Done', Item: d }); });
    m.pending.forEach(function(p) { detailRows.push({ Module: m.name, Status: p.level === 'critical' ? 'Critical' : 'Pending', Item: p.text }); });
  });
  var ws3 = XLSX.utils.json_to_sheet(detailRows);
  ws3['!cols'] = [{wch:22},{wch:10},{wch:80}];
  XLSX.utils.book_append_sheet(wb, ws3, 'Detail');

  XLSX.writeFile(wb, 'ERP_Module_Status_Report.xlsx');
}
