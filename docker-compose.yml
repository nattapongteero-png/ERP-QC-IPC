      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./uploads/huaikoeng:/app/public/uploads
    networks:
      - herbal-erp-network

  reporting-backend-huaikoeng:
    build:
      context: ./reporting-backend
      dockerfile: Dockerfile
    container_name: herbal-erp-reporting-huaikoeng
    restart: unless-stopped

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=mysql;Database=herbal_erp_huaikoeng;User=${MYSQL_USER:-herbal_user};Password=${MYSQL_PASSWORD:-herbal_password};
      - Jwt__Secret=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - Cors__AllowedOrigins=http://localhost:3000,http://localhost:33020,https://herbal-erp.bmscloud.in.th,https://herbal-erp-huaikoeng.bmscloud.in.th
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health | grep -q healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - herbal-erp-network



volumes:
  mysql_data:
    driver: local

networks:
  herbal-erp-network:
    driver: bridge
