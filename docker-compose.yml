services:
  # DevExpress Reporting Backend Service (.NET)
  reporting-backend:
    build:
      context: ./reporting-backend
      dockerfile: Dockerfile
    container_name: herbal-erp-reporting
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=mysql;Database=herbal_erp;User=${MYSQL_USER:-herbal_user};Password=${MYSQL_PASSWORD:-herbal_password};
      - Jwt__Secret=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - Cors__AllowedOrigins=http://localhost:3000,http://localhost:33020,https://herbal-erp.bmscloud.in.th,https://herbal-erp-dev.bmscloud.in.th
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health | grep -q healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - herbal-erp-network

  # MySQL database service
  mysql:
    image: mysql:8.0
    container_name: herbal-erp-mysql
    restart: unless-stopped
    ports:
      - "53306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=herbal_erp
      - MYSQL_USER=${MYSQL_USER:-herbal_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-herbal_password}
    # MySQL performance tuning
    command:
      - --max_connections=500
      - --innodb_buffer_pool_size=4G
      - --innodb_redo_log_capacity=1G
      - --innodb_log_buffer_size=64M
      - --innodb_flush_log_at_trx_commit=2
      - --innodb_flush_method=O_DIRECT
      - --innodb_read_io_threads=8
      - --innodb_write_io_threads=8
      - --thread_cache_size=128
      - --table_open_cache=4000
      - --table_definition_cache=2000
      - --tmp_table_size=256M
      - --max_heap_table_size=256M
      - --join_buffer_size=4M
      - --sort_buffer_size=4M
      - --read_buffer_size=2M
      - --read_rnd_buffer_size=4M
      - --wait_timeout=28800
      - --interactive_timeout=28800
      - --max_allowed_packet=256M
    # Runtime resource limits
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    volumes:
      - ./mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - herbal-erp-network

  # Main application service (MySQL) - Production
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      # Limit CPU during build to prevent 100% CPU usage on all cores
      # Adjust cpus value: 2.0 = 2 cores, 4.0 = 4 cores
      args:
        - BUILDKIT_CPU_LIMIT=2
    # Runtime resource limits
    deploy:
      resources:
        limits:
          cpus: '16.0'
          memory: 16G
    container_name: herbal-erp-app
    restart: unless-stopped
   # profiles: ["donotstart"]
    ports:
      - "33020:3000"
    environment:
      - NODE_ENV=production
      - DB_TYPE=mysql
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - DATABASE_URL=mysql://${MYSQL_USER:-herbal_user}:${MYSQL_PASSWORD:-herbal_password}@mysql:3306/herbal_erp
      - NEXT_PUBLIC_APP_URL=https://herbal-erp.bmscloud.in.th
      - NEXTAUTH_URL=https://herbal-erp.bmscloud.in.th
      # Internal reporting backend URL (Docker internal network)
      - REPORTING_BACKEND_URL=http://reporting-backend:5000
      # VMI webhook secret encryption key (64 hex chars = 32 bytes for AES-256)
      - VMI_ENCRYPTION_KEY=${VMI_ENCRYPTION_KEY:-2e3292276eae29d38b49c5e332688212e6ddac0dc3c776408a436de6c1b9fc42}
    depends_on:
      mysql:
        condition: service_healthy
      reporting-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - herbal-erp-network

  # Development application service with hot reload
  app-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    # Runtime resource limits
    deploy:
      resources:
        limits:
          cpus: '16.0'
          memory: 16G
    container_name: herbal-erp-app-dev
    restart: unless-stopped
    ports:
      - "33021:3000"
    environment:
      - NODE_ENV=development
      - DB_TYPE=mysql
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - DATABASE_URL=mysql://${MYSQL_USER:-herbal_user}:${MYSQL_PASSWORD:-herbal_password}@mysql:3306/herbal_erp
      - NEXT_PUBLIC_APP_URL=https://herbal-erp-dev.bmscloud.in.th
      - NEXTAUTH_URL=https://herbal-erp-dev.bmscloud.in.th
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      # Internal reporting backend URL (Docker internal network)
      - REPORTING_BACKEND_URL=http://reporting-backend:5000
      # VMI webhook secret encryption key (64 hex chars = 32 bytes for AES-256)
      - VMI_ENCRYPTION_KEY=${VMI_ENCRYPTION_KEY:-2e3292276eae29d38b49c5e332688212e6ddac0dc3c776408a436de6c1b9fc42}
    # Increase file descriptor limits for Turbopack file watching
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./next.config.ts:/app/next.config.ts
      - ./tailwind.config.ts:/app/tailwind.config.ts
      - ./postcss.config.mjs:/app/postcss.config.mjs
      - ./components.json:/app/components.json
    depends_on:
      mysql:
        condition: service_healthy
      reporting-backend:
        condition: service_healthy
    networks:
      - herbal-erp-network

