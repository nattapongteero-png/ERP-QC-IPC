      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      # HR employee photos — persist across container recreates and isolate
      # per tenant. Host dir must be owned by uid 1001 (nextjs).
      - ./uploads/arjaro:/app/public/uploads
    networks:
      - herbal-erp-network

