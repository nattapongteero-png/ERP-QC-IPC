version: '3.8'

services:
  # Main application service
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: herbal-erp-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_TYPE=sqlite
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - DATABASE_URL=file:/app/data/sqlite.db
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - herbal-erp-network

  # MySQL service (optional - for production with MySQL)
  mysql:
    image: mysql:8.0
    container_name: herbal-erp-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=herbal_erp
      - MYSQL_USER=${MYSQL_USER:-herbal_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-herbal_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - herbal-erp-network
    profiles:
      - mysql

  # Application with MySQL (optional)
  app-mysql:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: herbal-erp-app-mysql
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - DB_TYPE=mysql
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - DATABASE_URL=mysql://${MYSQL_USER:-herbal_user}:${MYSQL_PASSWORD:-herbal_password}@mysql:3306/herbal_erp
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - herbal-erp-network
    profiles:
      - mysql

volumes:
  app_data:
    driver: local
  mysql_data:
    driver: local

networks:
  herbal-erp-network:
    driver: bridge
