version: '3.8'

# Development docker-compose configuration
# Use: docker-compose -f docker/docker-compose.dev.yml up

services:
  app-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: herbal-erp-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DB_TYPE=sqlite
      - JWT_SECRET=dev-secret-key
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/.next
      - dev_data:/app/data
    networks:
      - herbal-erp-dev-network

volumes:
  dev_data:
    driver: local

networks:
  herbal-erp-dev-network:
    driver: bridge
